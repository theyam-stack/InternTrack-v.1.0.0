databases:
  - name: interntrack-db
    databaseName: interntrack
    user: interntrack
    plan: free

services:
  - type: web
    name: interntrack
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn interntrack.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /accounts/login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: interntrack-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
