<!DOCTYPE html>
<html>
<head>
    <title>Export - InternTrack</title>
    <style>
        nav a {
            display: inline-block;
            padding: 8px 16px;
            margin-right: 8px;
            background: #4a4a4a;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        nav a:hover {
            background: #2a2a2a;
        }
        .export-box {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            max-width: 400px;
        }
        .export-box input {
            padding: 6px;
            margin-right: 8px;
        }
        .export-box button {
            padding: 6px 14px;
        }
        #status {
            margin-top: 10px;
            font-style: italic;
            color: #555;
        }
    </style>
</head>
<body>
    <nav style="padding: 10px; background: #f5f5f5;">
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'internship_list' %}">Applications</a>
    </nav>

    <h1>Export Applications</h1>
    <p>Choose a file name below. If your browser supports it, you'll also be able to pick the save location.</p>

    <div class="export-box">
        <label>File name:</label><br>
        <input type="text" id="csv-filename" value="internship_applications">
        <button onclick="exportFile('csv')">Download CSV</button>
    </div>

    <div class="export-box">
        <label>File name:</label><br>
        <input type="text" id="pdf-filename" value="internship_report">
        <button onclick="exportFile('pdf')">Download PDF</button>
    </div>

    <div id="status"></div>

    <script>
        const exportUrls = {
            csv: "{% url 'export_csv' %}",
            pdf: "{% url 'export_pdf' %}"
        };
        const mimeTypes = {
            csv: 'text/csv',
            pdf: 'application/pdf'
        };
        const fileTypeDescriptions = {
            csv: { description: 'CSV file', accept: { 'text/csv': ['.csv'] } },
            pdf: { description: 'PDF file', accept: { 'application/pdf': ['.pdf'] } }
        };

        async function exportFile(kind) {
            const statusEl = document.getElementById('status');
            const filenameInput = document.getElementById(kind + '-filename');
            const filename = filenameInput.value.trim() || (kind === 'csv' ? 'internship_applications' : 'internship_report');
            const url = exportUrls[kind] + '?filename=' + encodeURIComponent(filename);

            statusEl.textContent = 'Preparing file...';

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('Server returned an error while generating the file.');
                }
                const blob = await response.blob();

                if (window.showSaveFilePicker) {
                    // Modern browsers (Chrome/Edge): native Save As dialog with location choice
                    const handle = await window.showSaveFilePicker({
                        suggestedName: filename + '.' + kind,
                        types: [fileTypeDescriptions[kind]]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    statusEl.textContent = 'Saved successfully.';
                } else {
                    // Fallback: normal browser download (no location picker available)
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = filename + '.' + kind;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    statusEl.textContent = 'Downloaded to your default Downloads folder (your browser does not support choosing a location).';
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    statusEl.textContent = 'Save cancelled.';
                } else {
                    statusEl.textContent = 'Something went wrong: ' + err.message;
                }
            }
        }
    </script>
    <a href="{% url 'dashboard' %}">Go back to home page</a>
</body>
</html>
